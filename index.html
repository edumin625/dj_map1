<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>부산시 편의점 지도 서비스</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  
  <!-- 커스텀 스타일시트 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- 모바일 상단 미니 바 (모바일에서만 노출) -->
    <header class="mobile-top-bar">
      <button class="mobile-search-btn-trigger" id="mobileSearchTrigger" aria-label="검색 및 필터 열기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>구·동, 편의점 브랜드 검색...</span>
      </button>
      <button class="mobile-gps-btn" id="mobileGpsBtn" title="내 위치 찾기" aria-label="내 위치 찾기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
      </button>
    </header>

    <!-- 모바일 바텀시트 백드롭 -->
    <div class="bottom-sheet-backdrop" id="bottomSheetBackdrop"></div>

    <!-- 좌측 사이드바 (모바일에서는 바텀시트) -->
    <aside class="sidebar" id="sidebar">
      
      <!-- 모바일 바텀시트 핸들 영역 -->
      <div class="bottom-sheet-handle-wrap" id="bottomSheetHandle">
        <div class="bottom-sheet-handle"></div>
        <div class="bottom-sheet-preview-info">
          <span>🏪 편의점 목록 (<strong id="mobilePreviewCount">0</strong>곳)</span>
          <span style="font-size:0.78rem; color:#2563eb; font-weight:600;">상세 필터 열기/접기</span>
        </div>
      </div>

      <!-- 사이드바 헤더 -->
      <div class="sidebar-header">
        <div class="header-title-wrap">
          <h1 class="app-title">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            부산 편의점 지도
          </h1>
          <span style="font-size:0.75rem; background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:12px;">무료지도</span>
        </div>
        <p class="app-subtitle">2026 소상공인시장진흥공단 부산 데이터 (2,780개 매장)</p>
      </div>

      <!-- 필터 및 검색 영역 -->
      <div class="filter-section">
        <!-- 통합 키워드 검색창 -->
        <div class="search-input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="상호명, 도로명, 지번 검색..." autocomplete="off">
          <button id="searchClearBtn" class="search-clear-btn" title="검색어 지우기">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <!-- 지역(구/동) 선택 -->
        <div class="select-row">
          <div class="select-wrap">
            <select id="guSelect" class="custom-select">
              <option value="">부산시 전체 (구·군)</option>
            </select>
          </div>
          <div class="select-wrap">
            <select id="dongSelect" class="custom-select" disabled>
              <option value="">행정동 전체</option>
            </select>
          </div>
        </div>

        <!-- 브랜드 필터 칩 -->
        <div class="brand-filter-group">
          <div class="filter-label-row">
            <span>편의점 브랜드</span>
            <button id="resetFilterBtn" class="reset-filter-btn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
              필터 초기화
            </button>
          </div>
          <div class="brand-chips-wrap">
            <button class="brand-chip active" data-brand="ALL">전체</button>
            <button class="brand-chip" data-brand="CU">
              <span class="brand-chip-dot" style="background:var(--brand-cu);"></span>CU
            </button>
            <button class="brand-chip" data-brand="GS25">
              <span class="brand-chip-dot" style="background:var(--brand-gs25);"></span>GS25
            </button>
            <button class="brand-chip" data-brand="세븐일레븐">
              <span class="brand-chip-dot" style="background:var(--brand-7eleven);"></span>세븐일레븐
            </button>
            <button class="brand-chip" data-brand="이마트24">
              <span class="brand-chip-dot" style="background:var(--brand-emart24);"></span>이마트24
            </button>
            <button class="brand-chip" data-brand="기타">
              <span class="brand-chip-dot" style="background:var(--brand-other);"></span>기타
            </button>
          </div>
        </div>
      </div>

      <!-- 결과 카운트 바 -->
      <div class="results-summary-bar">
        <span>검색 결과: <strong id="resultsCount" class="results-count">0</strong>건</span>
        <span style="font-size:0.75rem;">목록 클릭 시 지도 이동</span>
      </div>

      <!-- 편의점 결과 목록 -->
      <div class="stores-list-wrap" id="storesList">
        <!-- JS로 동적 생성 -->
      </div>

      <!-- 검색 결과 없을 때 표시 -->
      <div class="empty-state" id="emptyState" style="display:none;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        <p style="font-weight:600; margin-bottom:4px;">조건에 일치하는 편의점이 없습니다.</p>
        <p style="font-size:0.8rem;">검색어나 필터 옵션을 변경해보세요.</p>
      </div>

    </aside>

    <!-- 우측 메인 지도 영역 -->
    <main class="map-container">
      <div id="map"></div>

      <!-- 지도 위 우측 컨트롤 버튼들 -->
      <div class="map-floating-controls">
        <button class="map-control-btn" id="gpsBtn" title="내 위치 찾기" aria-label="내 위치 찾기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
        </button>
        <button class="map-control-btn" id="fitBoundsBtn" title="부산 전체보기" aria-label="부산 전체보기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
        </button>
        <button class="map-control-btn" id="zoomInBtn" title="확대" aria-label="확대">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="map-control-btn" id="zoomOutBtn" title="축소" aria-label="축소">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>

      <!-- 타일맵 전환 (우측 하단) -->
      <div class="tile-toggle-wrap">
        <button class="tile-btn active" data-tile="carto">클린 지도</button>
        <button class="tile-btn" data-tile="osm">OSM 기본</button>
      </div>
    </main>

  </div>

  <!-- Leaflet JS & MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  
  <!-- 데이터 (file:/// 환경에서도 바로 동작하도록 사전 로드) -->
  <script src="data/stores-data.js"></script>
  
  <!-- 메인 애플리케이션 스크립트 -->
  <script src="app.js"></script>
</body>
</html>
